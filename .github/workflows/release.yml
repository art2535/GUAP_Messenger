name: Full Cross-Platform Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Версия релиза (например: v1.3.0)'
        required: true
        type: string

      create_release:
        description: 'Создать/обновить GitHub Release'
        required: false
        type: boolean
        default: true

jobs:
  build-all:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Create appsettings.json from Secrets
        shell: bash
        run: |
          mkdir -p ./Messenger.API
          mkdir -p ./Messenger.Web
          echo '${{ secrets.APPSETTINGS_API_JSON }}' > ./Messenger.API/appsettings.json
          echo '${{ secrets.APPSETTINGS_WEB_JSON }}' > ./Messenger.Web/appsettings.json

      - name: Publish Windows
        run: |
          dotnet publish ./Messenger.API/Messenger.API.csproj -c Release -r win-x64 --self-contained true /p:PublishSingleFile=true /p:IncludeNativeLibrariesForSelfExtract=true -o ./publish/win-x64/Messenger.API
          dotnet publish ./Messenger.Web/Messenger.Web.csproj -c Release -r win-x64 --self-contained true /p:PublishSingleFile=true /p:IncludeNativeLibrariesForSelfExtract=true -o ./publish/win-x64/Messenger.Web

      - name: Publish Linux
        run: |
          dotnet publish ./Messenger.API/Messenger.API.csproj -c Release -r linux-x64 --self-contained true /p:PublishSingleFile=true /p:IncludeNativeLibrariesForSelfExtract=true -o ./publish/linux-x64/Messenger.API
          dotnet publish ./Messenger.Web/Messenger.Web.csproj -c Release -r linux-x64 --self-contained true /p:PublishSingleFile=true /p:IncludeNativeLibrariesForSelfExtract=true -o ./publish/linux-x64/Messenger.Web

      - name: Compile Inno Setup
        shell: pwsh
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" /Q /DAppVersion=${{ inputs.version }} ./Deployment/Messenger.iss

      - name: Prepare Artifacts
        shell: pwsh
        run: |
          $VERSION = "${{ inputs.version }}"
          
          Compress-Archive -Path "./publish/win-x64/*" -DestinationPath "./Messenger-$VERSION-Windows-x64.zip" -Force
          
          if (Test-Path "./publish/linux-x64") {
              tar.exe -czf "Messenger-$VERSION-Linux-x64.tar.gz" -C "./publish/linux-x64" .
          } else {
              Write-Error "Папка публикации в Linux не найдена!"
              exit 1
          }

          if (Test-Path "./Deployment/Output/Messenger-Setup.exe") {
              Move-Item -Path "./Deployment/Output/Messenger-Setup.exe" -Destination "./Messenger-$VERSION-Setup.exe" -Force
          } else {
              Write-Warning "Выходной файл Inno Setup не найден!"
          }

      - name: Upload Assets to GitHub Release
        if: inputs.create_release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.version }}
          name: ${{ inputs.version }}
          files: |
            Messenger-${{ inputs.version }}-Windows-x64.zip
            Messenger-${{ inputs.version }}-Linux-x64.tar.gz
            Messenger-${{ inputs.version }}-Setup.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
