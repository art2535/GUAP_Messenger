name: Messenger CI/CD

on:
  workflow_dispatch:
    inputs:
      configuration:
        description: 'Конфигурация сборки'
        required: false
        type: choice
        options:
          - Release
          - Debug
        default: Release

      run_tests:
        description: 'Запускать unit-тесты'
        required: false
        type: boolean
        default: true

      upload_artifacts:
        description: 'Загружать артефакты сборки'
        required: false
        type: boolean
        default: true

      upload_test_results:
        description: 'Загружать результаты тестов'
        required: false
        type: boolean
        default: true

      retention_days:
        description: 'Срок хранения артефактов (дней)'
        required: false
        type: number
        default: 7

jobs:
  build:
    name: Build Solution
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Restore dependencies
        run: dotnet restore Messenger.sln

      - name: Build solution
        run: dotnet build Messenger.sln --configuration ${{ inputs.configuration }} --no-restore

      - name: Upload build artifacts
        if: inputs.upload_artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-output-${{ inputs.configuration }}
          path: |
            **/bin/**
            **/obj/**
          retention-days: ${{ inputs.retention_days }}

  test:
    name: Run Unit Tests
    runs-on: ubuntu-latest
    needs: build
    if: inputs.run_tests

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Download build artifacts
        if: inputs.upload_artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-output-${{ inputs.configuration }}

      - name: Run all Unit Tests
        run: |
          dotnet test Messenger.sln \
            --configuration ${{ inputs.configuration }} \
            --no-build \
            --no-restore \
            --verbosity normal \
            --logger "trx;LogFileName=test-results.trx" \
            --results-directory ./TestResults

      - name: Upload test results
        if: always() && inputs.upload_test_results
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: ./TestResults/**/*.trx
          retention-days: ${{ inputs.retention_days }}